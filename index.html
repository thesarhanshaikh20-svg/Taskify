<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Sidebar -->
        <!-- Sidebar -->
<aside class="sidebar">

    <div class="logo">
        <i class="fa-solid fa-list-check"></i>
        <h2>TaskFlow</h2>
    </div>

    <nav>
        <ul>

            <li class="nav-item active" data-filter="all">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li class="nav-item" data-filter="all">
                <i class="fa-solid fa-layer-group"></i>
                All Tasks
            </li>

            <li class="nav-item" data-filter="today">
                <i class="fa-solid fa-calendar-days"></i>
                Today's Tasks
            </li>

            <li class="nav-item" data-filter="completed">
                <i class="fa-solid fa-circle-check"></i>
                Completed
            </li>

        </ul>
    </nav>

</aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="topbar">

                <div>
                    <h1>Task Dashboard</h1>
                    <p>Stay productive and organized 🚀</p>
                </div>

                <button id="themeToggle" class="theme-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>

            </header>

            <!-- Stats Cards -->
            <section class="stats">

                <div class="card">
                    <div>
                        <h4>Total Tasks</h4>
                        <h2 id="totalTasks">0</h2>
                    </div>

                    <i class="fa-solid fa-list card-icon blue"></i>
                </div>

                <div class="card">
                    <div>
                        <h4>Completed</h4>
                        <h2 id="completedTasks">0</h2>
                    </div>

                    <i class="fa-solid fa-check card-icon green"></i>
                </div>

                <div class="card">
                    <div>
                        <h4>Pending</h4>
                        <h2 id="pendingTasks">0</h2>
                    </div>

                    <i class="fa-solid fa-clock card-icon orange"></i>
                </div>

                <div class="card">
                    <div>
                        <h4>Productivity</h4>
                        <h2 id="productivity">0%</h2>
                    </div>

                    <i class="fa-solid fa-chart-line card-icon purple"></i>
                </div>

            </section>

            <!-- Progress -->
            <section class="progress-card">
                <h3>Overall Progress</h3>

                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>

                <p id="progressText">0% Completed</p>
            </section>

            <!-- Add Task -->
            <section class="add-task">

                <h3>Create New Task</h3>

                <form id="taskForm">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter task name"
                        required
                    >

                    <textarea
                        id="taskDescription"
                        placeholder="Task description"
                    ></textarea>

                    <div class="form-row">

                        <select id="category">

                            <option value="Study">
                                Study
                            </option>

                            <option value="Work">
                                Work
                            </option>

                            <option value="Personal">
                                Personal
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                        </select>

                        <select id="priority">

                            <option value="High">
                                High Priority
                            </option>

                            <option value="Medium">
                                Medium Priority
                            </option>

                            <option value="Low">
                                Low Priority
                            </option>

                        </select>

                    </div>

                    <input
                        type="date"
                        id="dueDate"
                    >

                    <button type="submit" class="add-btn">
                        <i class="fa-solid fa-plus"></i>
                        Add Task
                    </button>

                </form>

            </section>

            <!-- Search and Filter -->
            <section class="toolbar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Tasks..."
                >

                <select id="filterStatus">
                    <option value="all">
                        All Tasks
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="pending">
                        Pending
                    </option>
                </select>

            </section>

            <!-- Task List -->
            <section class="task-section">

                <div class="section-title">
                    <h3>Your Tasks</h3>
                </div>

                <div id="taskList">

                    <!-- Tasks JS se aayengi -->

                </div>

            </section>

        </main>

    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script src="script.js"></script>

</body>
</html>
